services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hsradius-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - mysql
    networks:
      - hsradius
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_DATABASE=radius
      - DB_USERNAME=radius
      - DB_PASSWORD=radiuspassword

  nginx:
    image: nginx:alpine
    container_name: hsradius-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hsradius

  mysql:
    image: mysql:8.0
    container_name: hsradius-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: radius
      MYSQL_USER: radius
      MYSQL_PASSWORD: radiuspassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hsradius

  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: hsradius-freeradius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./docker/freeradius/mods-enabled/sql:/etc/freeradius/mods-enabled/sql
      - ./docker/freeradius/sites-enabled/default:/etc/freeradius/sites-enabled/default
    depends_on:
      - mysql
    networks:
      - hsradius

networks:
  hsradius:
    driver: bridge

volumes:
  mysql_data:
    driver: local
